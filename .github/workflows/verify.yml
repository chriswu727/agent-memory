name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: ci-disposable-admin
          POSTGRES_DB: agent_memory
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_memory"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      MEMORY_DATABASE_URL: postgresql://memory_app:ci-disposable-app@127.0.0.1:55432/agent_memory
      MEMORY_MIGRATION_DATABASE_URL: postgresql://postgres:ci-disposable-admin@127.0.0.1:55432/agent_memory
      MEMORY_DATABASE_APP_PASSWORD: ci-disposable-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run membrain migrate
      - run: uv run ruff check src tests examples
      - run: uv run pytest -q
      - run: npm ci && npm test && npm run typecheck
        working-directory: sdk/typescript
      - run: uv build
