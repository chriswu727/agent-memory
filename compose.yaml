services:
  database:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1:${MEMORY_DATABASE_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MEMORY_DATABASE_ADMIN_PASSWORD:?Run agent-memory init first}
      POSTGRES_DB: agent_memory
    volumes:
      - memory_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_memory"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
volumes:
  memory_database:
