[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-runtime"
version = "0.1.0"
description = "A human-inspired memory engine for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "jsonschema[format]>=4.23,<5",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
# Embedded PostgreSQL + pgvector binaries. pgserver publishes wheels for CPython 3.9-3.12 on macOS,
# Windows and Linux x86_64; other platforms keep the Docker engine.
embedded = ["pgserver>=0.1.4,<0.2; python_version < '3.13' and (sys_platform != 'linux' or platform_machine == 'x86_64')"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "build>=1,<2", "httpx2>=2.16,<3",
       "pgserver>=0.1.4,<0.2; python_version < '3.13' and (sys_platform != 'linux' or platform_machine == 'x86_64')"]

[project.urls]
Homepage = "https://github.com/chriswu727/agent-memory"
Documentation = "https://github.com/chriswu727/agent-memory/blob/main/docs/reference.md"
Repository = "https://github.com/chriswu727/agent-memory"
Issues = "https://github.com/chriswu727/agent-memory/issues"

[project.scripts]
agent-memory = "agent_memory.cli:main"

[tool.hatch.build.targets.sdist]
exclude = ["/evaluations", "/sdk/typescript/node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.hatch.build.targets.wheel.force-include]
"architecture/memory-contract.schema.json" = "agent_memory/resources/memory-contract.schema.json"
"migrations" = "agent_memory/resources/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
