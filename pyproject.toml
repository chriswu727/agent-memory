[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "membrain-ai"
version = "0.1.0"
description = "memBrain: a human-inspired, source-traceable memory engine for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "jsonschema[format]>=4.23,<5",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
# Embedded PostgreSQL + pgvector binaries. pgserver publishes wheels for CPython 3.9-3.12 on macOS,
# Windows and Linux x86_64; other platforms keep the Docker engine.
embedded = ["pgserver>=0.1.4,<0.2; python_version < '3.13' and (sys_platform != 'linux' or platform_machine == 'x86_64')"]
# Local multilingual embeddings for semantic recall without an API key (ONNX Runtime, CPU only).
semantic = ["onnxruntime>=1.17,<2", "tokenizers>=0.15,<1", "numpy>=1.26,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "build>=1,<2", "httpx2>=2.16,<3",
       "pgserver>=0.1.4,<0.2; python_version < '3.13' and (sys_platform != 'linux' or platform_machine == 'x86_64')",
       "onnxruntime>=1.17,<2", "tokenizers>=0.15,<1", "numpy>=1.26,<3"]

[project.entry-points."hermes_agent.memory_providers"]
membrain = "membrain.adapters.hermes:register"

[project.urls]
Homepage = "https://github.com/chriswu727/membrain"
Documentation = "https://github.com/chriswu727/membrain/blob/main/docs/reference.md"
Repository = "https://github.com/chriswu727/membrain"
Issues = "https://github.com/chriswu727/membrain/issues"

[project.scripts]
membrain = "membrain.cli:main"

[tool.hatch.build.targets.sdist]
exclude = ["/evaluations", "/sdk/typescript/node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["src/membrain", "src/agent_memory"]

[tool.hatch.build.targets.wheel.force-include]
"architecture/memory-contract.schema.json" = "membrain/resources/memory-contract.schema.json"
"migrations" = "membrain/resources/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
